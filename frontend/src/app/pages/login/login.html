<div class="auth-page">
  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">INV</div>
      <h1>Invoisly Platform</h1>
      <p>Invoice & Payment Tracking System</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">Work Email</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="admin@gamil.com"
            required
            email
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
        </div>

        <div class="input-wrapper">
          <span class="input-icon">⚿</span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <button
        class="submit-btn"
        type="submit"
        [disabled]="loginForm.invalid || loading()"
      >
        {{ loading() ? 'Authenticating...' : 'Sign In to Portal' }}
      </button>

    </form>

    <div class="quick-credentials">
      <span class="cred-title">System Role Credentials:</span>
      <div class="cred-badges">
        <button type="button" class="cred-btn" (click)="fillDemo('admin')" title="Fill Admin Credentials">
          Admin: admin@gamil.com
        </button>
      </div>
    </div>

  </div>
</div>
